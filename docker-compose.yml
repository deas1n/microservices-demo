services:
  users-service:
    build: ./users-service
    ports:
      - "8001:8001"
    networks:
      - app-net

  tasks-service:
    build: ./tasks-service
    ports:
      - "8002:8002"
    environment:
      - USERS_SERVICE_URL=http://users-service:8001
    depends_on:
      - users-service
    networks:
      - app-net

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - tasks-service
      - users-service
    networks:
      - app-net

networks:
  app-net:
    driver: bridge